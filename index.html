<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한 소절 · 계이름 연습</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#253b36;font-family:"Malgun Gothic",sans-serif}main{max-width:1000px;margin:60px auto;padding:24px}.brand{font-size:13px;letter-spacing:3px;color:#668075}h1{font-size:38px;letter-spacing:-2px;margin:18px 0}p{color:#65756d;line-height:1.8}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:30px 0}select,button{font:inherit;border-radius:9px;padding:12px 18px;border:1px solid #cdd6ce;background:white;color:#253b36}button{cursor:pointer}button.primary{background:#315e4b;color:white;border-color:#315e4b}button:hover{filter:brightness(.96)}button:focus-visible,select:focus-visible{outline:3px solid #d5a749;outline-offset:3px}.card{background:white;border:1px solid #dce2d9;border-radius:16px;padding:26px;box-shadow:0 12px 40px #29422c08}.card-head{display:flex;justify-content:space-between;font-size:12px;color:#718277;gap:16px}.score{overflow-x:auto;padding:22px 0}svg{display:block;min-width:740px;width:100%;height:auto}#answer{font-size:20px;letter-spacing:3px;line-height:2;padding:18px;background:#edf3eb;border-radius:10px;margin-top:18px}#answer[hidden]{display:none}.tip{font-size:13px;margin-top:26px}.footer{border-top:1px solid #d9dfd5;margin-top:42px;padding-top:20px;font-size:12px;color:#78877b}@media(max-width:600px){main{margin:20px auto;padding:18px}h1{font-size:30px}.card{padding:16px}}
</style>
<main>
<div class="brand">ONE LITTLE MELODY</div><h1>한 소절, 계이름 연습</h1>
<p>악보를 보고 계이름을 소리 내어 읽어보세요.<br>새로운 악보를 눌러 다음 멜로디에 도전할 수 있어요.</p>
<div class="controls"><label for="level">음역 </label><select id="level"><option value="basic">기초 · 도₄ ~ 솔₄</option><option value="full" selected>기본 · 도₄ ~ 도₅</option><option value="wide">확장 · 도₄ ~ 솔₅</option></select><button class="primary" id="new">↻ 새로운 악보</button><button id="toggle" aria-expanded="false" aria-controls="answer">계이름 정답 보기</button></div>
<section class="card" aria-label="연습 악보"><div class="card-head"><span>높은음자리표 · 도장조 · 4/4박자</span><span id="number" aria-live="polite"></span></div><div class="score" id="score"></div><div id="answer" hidden></div></section>
<p class="tip">모든 음표는 4분음표입니다. | 는 마디 구분이에요.<br>도₄는 가운데 도, 도₅는 그보다 한 옥타브 높은 도입니다. 음표 위치가 높아지는 순서대로 도–레–미–파–솔–라–시가 반복됩니다.</p>
<div class="footer">오프라인 사용 가능 · 설치 및 로그인 불필요 · 새 악보를 만들면 이전 정답은 자동으로 숨겨집니다.</div>
</main>
<script>
'use strict';
const names=['도₄','레₄','미₄','파₄','솔₄','라₄','시₄','도₅','레₅','미₅','파₅','솔₅'];
let melody=[],serial=0;
const ns='http://www.w3.org/2000/svg';
function shape(tag,attrs,parent){const el=document.createElementNS(ns,tag);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);parent.append(el);return el;}
function line(svg,x1,y1,x2,y2,width=1.2){shape('line',{x1,y1,x2,y2,stroke:'#27382f','stroke-width':width},svg);}
function generate(){
 const max={basic:4,full:7,wide:11}[document.querySelector('#level').value];
 let next;do{next=Array.from({length:8},()=>Math.floor(Math.random()*(max+1)));}while(next.join()===melody.join());melody=next;serial++;
 const container=document.querySelector('#score');container.replaceChildren();
 const svg=shape('svg',{viewBox:'0 0 900 220',role:'img','aria-label':'무작위 멜로디 연습 악보. 계이름 정답은 아래 버튼으로 확인할 수 있습니다.'},container);
 for(let y=60;y<=140;y+=20)line(svg,20,y,875,y);
 // Clef is drawn as a vector path so no network font is needed.
 shape('path',{d:'M 67 166 C 90 158 85 131 75 105 C 63 75 53 36 67 23 C 87 36 74 63 56 84 C 24 117 37 145 61 145 C 88 145 94 112 73 103 C 52 94 44 119 58 127 M 67 23 C 63 65 62 106 72 155 C 78 188 49 193 46 174 C 45 161 60 160 61 171',fill:'none',stroke:'#27382f','stroke-width':4.5,'stroke-linecap':'round'},svg);
 shape('text',{x:104,y:93,'font-size':30,'font-family':'serif','font-weight':'bold'},svg).textContent='4';
 shape('text',{x:104,y:132,'font-size':30,'font-family':'serif','font-weight':'bold'},svg).textContent='4';
 melody.forEach((pitch,i)=>{
  const x=164+i*88+(i>=4?12:0),y=160-pitch*10;
  // Staff lines: E4=140, G4=120, B4=100, D5=80, F5=60.
  for(let ledger=160;ledger<=y;ledger+=20)line(svg,x-17,ledger,x+17,ledger);
  for(let ledger=40;ledger>=y;ledger-=20)line(svg,x-17,ledger,x+17,ledger);
  shape('ellipse',{cx:x,cy:y,rx:12,ry:8,fill:'#27382f',transform:`rotate(-18 ${x} ${y})`},svg);
  const down=pitch>=6;line(svg,down?x-11:x+11,y,down?x-11:x+11,y+(down?58:-58),2);
 });
 line(svg,490,60,490,140);line(svg,864,60,864,140);line(svg,874,60,874,140,4);
 document.querySelector('#number').textContent=`연습 ${serial} · 2마디`;
 document.querySelector('#answer').textContent=melody.map((p,i)=>(i===4?' | ':'')+names[p]).join('  ');
 document.querySelector('#answer').hidden=true;document.querySelector('#toggle').textContent='계이름 정답 보기';document.querySelector('#toggle').setAttribute('aria-expanded','false');
}
document.querySelector('#new').addEventListener('click',generate);
document.querySelector('#level').addEventListener('change',generate);
document.querySelector('#toggle').addEventListener('click',()=>{const answer=document.querySelector('#answer');answer.hidden=!answer.hidden;document.querySelector('#toggle').setAttribute('aria-expanded',String(!answer.hidden));document.querySelector('#toggle').textContent=answer.hidden?'계이름 정답 보기':'정답 숨기기';});
generate();
</script>
</html>
